<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五勢力混戰 - 60格運氣塔版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            height: 100vh;
            gap: 10px;
            padding: 10px;
        }

        /* === 左側：60格運氣塔 === */
        .luck-tower-container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 0;
            border: 2px solid rgba(167, 139, 250, 0.3);
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .luck-tower-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            color: #a78bfa;
            padding: 12px;
            border-bottom: 2px solid rgba(167, 139, 250, 0.3);
            background: rgba(0, 0, 0, 0.9);
            border-radius: 13px 13px 0 0;
            flex-shrink: 0;
        }

        .luck-tower-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            min-height: 0;
        }

        .luck-tower-wrapper::-webkit-scrollbar { width: 8px; }
        .luck-tower-wrapper::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #a78bfa, #7c3aed); 
            border-radius: 4px; 
        }

        .luck-tower-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding-bottom: 20px;
        }

        .luck-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            min-height: 50px;
        }

        .luck-cell:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.6em;
            opacity: 0.5;
            z-index: 1;
        }

        .luck-cell.faction-spot {
            border: 2px solid;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .luck-cell.charm { border-color: #e056fd; }
        .luck-cell.capital { border-color: #f1c40f; }
        .luck-cell.wisdom { border-color: #22a6b3; }
        .luck-cell.harmony { border-color: #6ab04c; }
        .luck-cell.power { border-color: #eb4d4b; }

        .faction-icon {
            font-size: 1.5em;
            opacity: 0.4;
            position: absolute;
            z-index: 0;
            color: currentColor;
        }

        .player-avatars {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2px;
            z-index: 2;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .mini-avatar {
            font-size: 1.1em;
            filter: drop-shadow(0 0 2px black);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .mini-avatar:hover {
            transform: scale(1.2);
        }

        .luck-cell.crowded .mini-avatar {
            font-size: 0.8em;
        }

        /* === 中間：遊戲區域 === */
        .game-area {
            display: grid;
            grid-template-rows: 180px 1fr 200px;
            gap: 10px;
            min-height: 0;
        }

        .top-players { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .middle-area { 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 15px;
        }
        .bottom-players { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* 玩家卡片 - 增強版 */
        .player-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .player-card.active-turn {
            border-color: #ffd43b;
            box-shadow: 0 0 25px rgba(255, 212, 59, 0.8);
            transform: scale(1.03);
            animation: activeGlow 2s ease-in-out infinite;
        }

        @keyframes activeGlow {
            0%, 100% { box-shadow: 0 0 25px rgba(255, 212, 59, 0.8); }
            50% { box-shadow: 0 0 35px rgba(255, 212, 59, 1); }
        }

        .player-card.eliminated { filter: grayscale(100%) brightness(0.5); opacity: 0.6; }
        .player1-theme { border-left: 6px solid #4dabf7; }
        .player2-theme { border-left: 6px solid #ff6b6b; }
        .player3-theme { border-left: 6px solid #51cf66; }
        .player4-theme { border-left: 6px solid #cc5de8; }

        .player-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 12px; 
        }

        .player-info { 
            display: flex; 
            flex-direction: column;
            gap: 8px;
        }

        .player-name-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar { 
            font-size: 2.5em; 
            cursor: pointer; 
            transition: transform 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .player-avatar:hover { transform: scale(1.15) rotate(5deg); }

        .player-name { 
            font-weight: bold; 
            font-size: 1.3em; 
            line-height: 1;
        }

        /* 分數徽章 */
        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #ffd43b, #fab005);
            color: #000;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9em;
            box-shadow: 0 3px 10px rgba(255, 212, 59, 0.4);
            border: 2px solid rgba(255, 212, 59, 0.6);
            animation: scorePulse 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        @keyframes scorePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .score-badge.high-score {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            border-color: rgba(255, 107, 107, 0.6);
            animation: highScorePulse 1.5s ease-in-out infinite;
        }

        @keyframes highScorePulse {
            0%, 100% { 
                box-shadow: 0 3px 10px rgba(255, 107, 107, 0.4);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 5px 20px rgba(255, 107, 107, 0.8);
                transform: scale(1.08);
            }
        }

        .player-stats { 
            display: flex; 
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .stat-row {
            display: flex;
            gap: 12px;
            font-size: 0.95em;
            font-weight: bold;
        }

        .stat { 
            display: flex; 
            align-items: center; 
            gap: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .stat:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: scale(1.05);
        }

        .health { color: #ff6b6b; }
        .mana { color: #4dabf7; }
        .deck-count { color: #ffd43b; }
        .luck-stat { color: #a78bfa; }

        /* 手牌區域 */
        .hand-area { 
            flex: 1; 
            display: flex; 
            gap: 5px; 
            align-items: center; 
            justify-content: flex-start; 
            flex-wrap: nowrap; 
            min-height: 85px; 
            overflow-x: auto; 
            padding-bottom: 5px; 
        }
        .hand-area::-webkit-scrollbar { height: 6px; }
        .hand-area::-webkit-scrollbar-thumb { background: rgba(77, 171, 247, 0.6); border-radius: 3px; }
        .player1-card .hand-area { 
            min-height: 105px; 
            background: rgba(77, 171, 247, 0.1); 
            border-radius: 8px; 
            padding: 8px; 
        }
        .ai-hand-display { 
            display: flex; 
            gap: 3px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .ai-card-back { 
            width: 28px; 
            height: 38px; 
            background: linear-gradient(135deg, #4a5568, #2d3748); 
            border-radius: 3px; 
            border: 1px solid rgba(255,255,255,0.3); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.85em; 
        }

        /* 戰場容器 */
        .battlefield { 
            display: grid; 
            grid-template-columns: repeat(4, 90px); 
            grid-template-rows: repeat(4, 90px); 
            gap: 8px; 
            background: rgba(0,0,0,0.6); 
            padding: 20px; 
            border-radius: 15px; 
            border: 3px solid rgba(255,255,255,0.3); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .grid-slot { 
            background: rgba(255,255,255,0.05); 
            border: 2px dashed rgba(255,255,255,0.3); 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }
        .grid-slot:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .grid-slot.empty::before { content: '+'; color: rgba(255,255,255,0.4); font-size: 2em; font-weight: bold; }
        .grid-slot.highlighted { 
            background: rgba(81, 207, 102, 0.3); 
            border: 2px solid #51cf66; 
            animation: slotPulse 1s ease-in-out infinite; 
        }
        @keyframes slotPulse { 
            0%, 100% { box-shadow: 0 0 15px rgba(81, 207, 102, 0.7); } 
            50% { box-shadow: 0 0 25px rgba(81, 207, 102, 1); } 
        }
        .slot-player1 { border: 2px solid #4dabf7; background: rgba(77, 171, 247, 0.25); }
        .slot-player2 { border: 2px solid #ff6b6b; background: rgba(255, 107, 107, 0.25); }
        .slot-player3 { border: 2px solid #51cf66; background: rgba(81, 207, 102, 0.25); }
        .slot-player4 { border: 2px solid #cc5de8; background: rgba(204, 93, 232, 0.25); }

        /* 卡牌樣式 */
        .card { 
            width: 80px; 
            height: 110px; 
            border-radius: 8px; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 5px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            user-select: none; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); 
            color: white; 
            border: 2px solid rgba(255,255,255,0.3); 
            flex-shrink: 0; 
        }
        .card:hover { transform: translateY(-6px) scale(1.08); z-index: 15; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .card.selected { border: 3px solid #ffd43b; box-shadow: 0 0 20px #ffd43b; transform: translateY(-10px) scale(1.1); }
        .card.playable { border: 2px solid #51cf66; box-shadow: 0 0 12px rgba(81, 207, 102, 0.7); }
        .card.can-attack { border: 2px solid #ff6b6b; animation: attackReady 1.5s ease-in-out infinite; }
        @keyframes attackReady { 
            0%, 100% { box-shadow: 0 0 10px rgba(255, 107, 107, 0.7); } 
            50% { box-shadow: 0 0 20px rgba(255, 107, 107, 1); } 
        }
        .card.charm { background: linear-gradient(135deg, #e056fd, #be2edd); }
        .card.capital { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        .card.wisdom { background: linear-gradient(135deg, #22a6b3, #0984e3); }
        .card.harmony { background: linear-gradient(135deg, #6ab04c, #badc58); }
        .card.power { background: linear-gradient(135deg, #eb4d4b, #ff7979); }
        .card-cost { 
            position: absolute; 
            top: -5px; 
            left: -5px; 
            width: 24px; 
            height: 24px; 
            background: #fff; 
            color: #000; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 0.9em; 
            border: 2px solid #333; 
        }
        .card-emoji { font-size: 2em; margin: 6px 0; }
        .card-name { font-size: 0.7em; font-weight: bold; text-align: center; margin-bottom: 4px; line-height: 1.1; }
        .card-faction { font-size: 0.6em; opacity: 0.8; margin-bottom: 4px; text-align: center; }
        .card-stats { margin-top: auto; display: flex; width: 100%; justify-content: space-between; font-weight: bold; font-size: 0.8em; }
        .card-atk { color: #ff8787; text-shadow: 1px 1px 2px #000; }
        .card-hp { color: #69db7c; text-shadow: 1px 1px 2px #000; }
        .field-card { width: 100%; height: 100%; padding: 3px; font-size: 0.9em; }
        .field-card .card-cost { width: 18px; height: 18px; font-size: 0.75em; }
        .field-card .card-emoji { font-size: 1.6em; margin: 2px 0; }
        .field-card .card-name { font-size: 0.6em; }
        .field-card .card-faction { font-size: 0.5em; }

        /* === 右側：戰鬥記錄 === */
        .battle-log-panel { 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(15px); 
            border-radius: 12px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            border: 2px solid rgba(255, 255, 255, 0.2); 
            overflow: hidden; 
            min-height: 0;
            height: 100%;
        }
        .log-header { 
            text-align: center; 
            font-weight: bold; 
            font-size: 1em; 
            margin-bottom: 10px; 
            color: #ffd43b; 
            border-bottom: 1px solid rgba(255, 212, 59, 0.4); 
            padding-bottom: 6px; 
            flex-shrink: 0; 
        }
        .log-content { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            font-size: 0.8em; 
            min-height: 0; 
        }
        .log-content::-webkit-scrollbar { width: 5px; }
        .log-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
        .log-entry { 
            padding: 6px 8px; 
            border-radius: 5px; 
            background: rgba(255,255,255,0.1); 
            border-left: 3px solid #4dabf7; 
            line-height: 1.3; 
            animation: logSlideIn 0.3s ease-out; 
            flex-shrink: 0; 
        }
        @keyframes logSlideIn { 
            from { transform: translateX(10px); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }
        .log-player1 { border-left-color: #4dabf7; background: rgba(77, 171, 247, 0.15); }
        .log-player2 { border-left-color: #ff6b6b; background: rgba(255, 107, 107, 0.15); }
        .log-player3 { border-left-color: #51cf66; background: rgba(81, 207, 102, 0.15); }
        .log-player4 { border-left-color: #cc5de8; background: rgba(204, 93, 232, 0.15); }
        .log-system { border-left-color: #ffd43b; background: rgba(255, 212, 59, 0.15); font-weight: bold; }
        .log-time { font-size: 0.7em; opacity: 0.7; margin-bottom: 2px; }

        /* 控制按鈕 */
        .control-panel { 
            position: fixed; 
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex; 
            gap: 12px; 
            z-index: 100; 
        }
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); 
            transition: all 0.3s ease; 
            font-size: 0.9em; 
        }
        .btn-end { background: linear-gradient(135deg, #51cf66, #2b8a3e); color: white; }
        .btn-end:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); }
        .btn-end:disabled { background: #666; cursor: not-allowed; opacity: 0.6; }
        .btn-reset { background: linear-gradient(135deg, #868e96, #495057); color: white; }
        .btn-reset:hover { transform: translateY(-2px) scale(1.05); }

        /* 特效系統 */
        .damage-text { 
            position: fixed; 
            font-weight: bold; 
            font-size: 1.5em; 
            text-shadow: 2px 2px 4px black; 
            pointer-events: none; 
            animation: floatUp 1s forwards; 
            z-index: 200; 
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(1); opacity: 1; } 
            100% { transform: translateY(-30px) scale(1.2); opacity: 0; } 
        }
        .turn-indicator { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 3em; 
            font-weight: bold; 
            text-shadow: 0 0 20px black; 
            pointer-events: none; 
            opacity: 0; 
            z-index: 300; 
        }
        .turn-indicator.show { animation: turnAnnounce 2s forwards; }
        @keyframes turnAnnounce { 
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } 
        }
        .game-over { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.95); 
            color: white; 
            padding: 30px 40px; 
            border-radius: 15px; 
            font-size: 1.5em; 
            text-align: center; 
            z-index: 400; 
            display: none; 
            border: 3px solid #ffd43b; 
            box-shadow: 0 0 40px rgba(255, 212, 59, 0.5); 
        }
        .game-over.show { display: block; animation: gameOverSlide 0.8s ease-out; }
        @keyframes gameOverSlide { 
            from { transform: translate(-50%, -100%); opacity: 0; } 
            to { transform: translate(-50%, -50%); opacity: 1; } 
        }

        /* 響應式設計 */
        @media (max-width: 1400px) {
            .main-container { grid-template-columns: 280px 1fr 280px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左側：60格運氣塔 -->
        <div class="luck-tower-container">
            <div class="luck-tower-title">🎲 運氣塔 (60格)</div>
            <div class="luck-tower-wrapper">
                <div class="luck-tower-grid" id="luck-tower-grid">
                    <!-- 60個格子將由JavaScript生成 -->
                </div>
            </div>
        </div>

        <!-- 中間：遊戲區域 -->
        <div class="game-area">
            <div class="top-players">
                <div class="player-card player2-theme" id="player2-card">
                    <div class="player-header">
                        <div class="player-info">
                            <div class="player-name-row">
                                <span class="player-avatar" onclick="game.handlePlayerClick(1)">👹</span>
                                <div>
                                    <div class="player-name">烈焰魔王</div>
                                    <div class="score-badge" id="score-badge-2">
                                        🏆 <span id="player2-score">0</span>/15
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="player-stats">
                            <div class="stat-row">
                                <span class="stat health">❤️ <span id="player2-hp">30</span></span>
                                <span class="stat mana">💎 <span id="player2-mana">1</span>/10</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat deck-count">📚 <span id="player2-deck">25</span></span>
                                <span class="stat luck-stat">🎲 <span id="player2-luck">0</span>/60</span>
                            </div>
                        </div>
                    </div>
                    <div class="ai-hand-display" id="player2-hand"></div>
                </div>
                <div class="player-card player3-theme" id="player3-card">
                    <div class="player-header">
                        <div class="player-info">
                            <div class="player-name-row">
                                <span class="player-avatar" onclick="game.handlePlayerClick(2)">🧙‍♂️</span>
                                <div>
                                    <div class="player-name">自然法師</div>
                                    <div class="score-badge" id="score-badge-3">
                                        🏆 <span id="player3-score">0</span>/15
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="player-stats">
                            <div class="stat-row">
                                <span class="stat health">❤️ <span id="player3-hp">30</span></span>
                                <span class="stat mana">💎 <span id="player3-mana">1</span>/10</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat deck-count">📚 <span id="player3-deck">25</span></span>
                                <span class="stat luck-stat">🎲 <span id="player3-luck">0</span>/60</span>
                            </div>
                        </div>
                    </div>
                    <div class="ai-hand-display" id="player3-hand"></div>
                </div>
            </div>
            <div class="middle-area">
                <div class="battlefield" id="battlefield"></div>
            </div>
            <div class="bottom-players">
                <div class="player-card player1-theme" id="player1-card">
                    <div class="player-header">
                        <div class="player-info">
                            <div class="player-name-row">

                                <div>
                                    <div class="player-name">你</div>

                            <div class="stat-row">
                                <span class="stat deck-count">📚 <span id="player1-deck">25</span></span>

                    <div class="player-header">
                        <div class="player-info">
                            <div class="player-name-row">
                                <span class="player-avatar" onclick="game.handlePlayerClick(3)">🔮</span>
                                <div>
                                    <div class="player-name">虛空行者</div>
                                    <div class="score-badge" id="score-badge-4">
                                        🏆 <span id="player4-score">0</span>/15
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="player-stats">
                            <div class="stat-row">
                                <span class="stat health">❤️ <span id="player4-hp">30</span></span>
                                <span class="stat mana">💎 <span id="player4-mana">1</span>/10</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat deck-count">📚 <span id="player4-deck">25</span></span>
                                <span class="stat luck-stat">🎲 <span id="player4-luck">0</span>/60</span>

                    <div class="ai-hand-display" id="player4-hand"></div>

        </div>

        <!-- 右側：戰鬥記錄 -->
        <div class="battle-log-panel">
            <div class="log-header">📜 戰鬥記錄</div>
            <div class="log-content" id="battle-log-content"></div>
        </div>
    </div>

    <div class="control-panel">
        <button class="btn btn-end" id="end-turn-btn" onclick="game.endTurn()">結束回合 (空白鍵)</button>
        <button class="btn btn-reset" onclick="resetGame()">重新開始 🔄</button>
    </div>
    <div class="turn-indicator" id="turn-indicator"></div>
    <div class="game-over" id="game-over"></div>

    <script>
        // === 遊戲常數定義 ===
        const FACTIONS = {
            charm: { name: '魅力', icon: '🎭', color: '#e056fd' },
            capital: { name: '資本', icon: '💰', color: '#f1c40f' },
            wisdom: { name: '智慧', icon: '🧠', color: '#22a6b3' },
            harmony: { name: '協調', icon: '🤝', color: '#6ab04c' },
            power: { name: '力量', icon: '⚔️', color: '#eb4d4b' }
        };

        // 勢力指示物固定位置 (每12格一個勢力)
        const FACTION_SPOTS = {
            12: 'charm',
            24: 'capital', 
            36: 'wisdom',
            48: 'harmony',
            60: 'power'
        };

        const CARD_DATABASE = [
            // 🎭 魅力勢力 (1) - 1費卡×5張
            { id: 1, name: '魅惑使者', cost: 1, attack: 1, health: 2, faction: 'charm', emoji: '💋', scoreValue: 1 },
            { id: 2, name: '魅影舞者', cost: 1, attack: 1, health: 2, faction: 'charm', emoji: '💃', scoreValue: 1 },
            { id: 3, name: '說客', cost: 1, attack: 1, health: 2, faction: 'charm', emoji: '🗣️', scoreValue: 1 },
            { id: 4, name: '偽裝大師', cost: 1, attack: 1, health: 2, faction: 'charm', emoji: '🎭', scoreValue: 1 },
            { id: 5, name: '社交蝴蝶', cost: 1, attack: 1, health: 2, faction: 'charm', emoji: '🦋', scoreValue: 1 },

            // 💰 資本勢力 (2) - 2費卡×5張
            { id: 6, name: '商業大亨', cost: 2, attack: 2, health: 3, faction: 'capital', emoji: '💼', scoreValue: 2 },
            { id: 7, name: '投資專家', cost: 2, attack: 2, health: 3, faction: 'capital', emoji: '📈', scoreValue: 2 },
            { id: 8, name: '銀行家', cost: 2, attack: 2, health: 3, faction: 'capital', emoji: '🏦', scoreValue: 2 },
            { id: 9, name: '地產大王', cost: 2, attack: 2, health: 3, faction: 'capital', emoji: '🏘️', scoreValue: 2 },
            { id: 10, name: '黃金商人', cost: 2, attack: 2, health: 3, faction: 'capital', emoji: '🥇', scoreValue: 2 },

            // 🧠 智慧勢力 (3) - 3費卡×5張
            { id: 11, name: '圖書館長', cost: 3, attack: 3, health: 4, faction: 'wisdom', emoji: '📚', scoreValue: 3 },
            { id: 12, name: '預言家', cost: 3, attack: 3, health: 4, faction: 'wisdom', emoji: '🔮', scoreValue: 3 },
            { id: 13, name: '煉金術士', cost: 3, attack: 3, health: 4, faction: 'wisdom', emoji: '⚗️', scoreValue: 3 },
            { id: 14, name: '策略大師', cost: 3, attack: 3, health: 4, faction: 'wisdom', emoji: '♟️', scoreValue: 3 },
            { id: 15, name: '學者', cost: 3, attack: 3, health: 4, faction: 'wisdom', emoji: '🎓', scoreValue: 3 },

            // 🤝 協調勢力 (4) - 4費卡×5張
            { id: 16, name: '和平使者', cost: 4, attack: 4, health: 5, faction: 'harmony', emoji: '🕊️', scoreValue: 4 },
            { id: 17, name: '醫療團隊', cost: 4, attack: 4, health: 5, faction: 'harmony', emoji: '⚕️', scoreValue: 4 },
            { id: 18, name: '調停者', cost: 4, attack: 4, health: 5, faction: 'harmony', emoji: '⚖️', scoreValue: 4 },
            { id: 19, name: '守護騎士', cost: 4, attack: 4, health: 5, faction: 'harmony', emoji: '🛡️', scoreValue: 4 },
            { id: 20, name: '生命之樹', cost: 4, attack: 4, health: 5, faction: 'harmony', emoji: '🌳', scoreValue: 4 },

            // ⚔️ 力量勢力 (5) - 5費卡×5張
            { id: 21, name: '泰坦巨人', cost: 5, attack: 5, health: 6, faction: 'power', emoji: '🗿', scoreValue: 5 },
            { id: 22, name: '狂戰士', cost: 5, attack: 5, health: 6, faction: 'power', emoji: '⚡', scoreValue: 5 },
            { id: 23, name: '龍騎士', cost: 5, attack: 5, health: 6, faction: 'power', emoji: '🐉', scoreValue: 5 },
            { id: 24, name: '戰爭領主', cost: 5, attack: 5, health: 6, faction: 'power', emoji: '👑', scoreValue: 5 },
            { id: 25, name: '毀滅使者', cost: 5, attack: 5, health: 6, faction: 'power', emoji: '💥', scoreValue: 5 }
        ];

        class Game {
            constructor() {
                this.players = [
                    { id: 0, name: '你', avatar: '👤', hp: 30, maxHp: 30, mana: 1, maxMana: 1, hand: [], deck: [], eliminated: false, score: 0, luck: 0 },
                    { id: 1, name: '烈焰魔王', avatar: '👹', hp: 30, maxHp: 30, mana: 1, maxMana: 1, hand: [], deck: [], eliminated: false, score: 0, luck: 0 },
                    { id: 2, name: '自然法師', avatar: '🧙‍♂️', hp: 30, maxHp: 30, mana: 1, maxMana: 1, hand: [], deck: [], eliminated: false, score: 0, luck: 0 },
                    { id: 3, name: '虛空行者', avatar: '🔮', hp: 30, maxHp: 30, mana: 1, maxMana: 1, hand: [], deck: [], eliminated: false, score: 0, luck: 0 }
                ];

                this.battlefield = Array(16).fill(null);
                this.currentPlayerIndex = 0;
                this.round = 1;
                this.selectedCardIndex = null;
                this.selectedAttackerIndex = null;
                this.gameOver = false;
                this.battleLog = [];

                this.initLuckTower();
                this.initDecks();
                this.startGame();
                this.setupControls();
            }

            // 初始化60格運氣塔 (4列×15行)
            initLuckTower() {
                const towerGrid = document.getElementById('luck-tower-grid');
                towerGrid.innerHTML = '';

                for (let i = 1; i <= 60; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'luck-cell';
                    cell.id = `luck-cell-${i}`;

                    const number = document.createElement('div');
                    number.className = 'cell-number';
                    number.textContent = i;
                    cell.appendChild(number);

                    if (FACTION_SPOTS[i]) {
                        const faction = FACTION_SPOTS[i];
                        cell.classList.add('faction-spot', faction);
                        
                        const icon = document.createElement('div');
                        icon.className = 'faction-icon';
                        icon.textContent = FACTIONS[faction].icon;
                        cell.appendChild(icon);
                    }

                    const avatarContainer = document.createElement('div');
                    avatarContainer.className = 'player-avatars';
                    avatarContainer.id = `avatars-${i}`;
                    cell.appendChild(avatarContainer);

                    towerGrid.appendChild(cell);
                }
                
                this.updateLuckTowerDisplay();
            }

            updateLuckTowerDisplay() {
                for (let i = 1; i <= 60; i++) {
                    const avatarContainer = document.getElementById(`avatars-${i}`);
                    if (avatarContainer) {
                        avatarContainer.innerHTML = '';
                    }
                    const cell = document.getElementById(`luck-cell-${i}`);
                    if (cell) {
                        cell.classList.remove('crowded');
                    }
                }

                this.players.forEach(player => {
                    if (player.luck > 0 && player.luck <= 60) {
                        const avatarContainer = document.getElementById(`avatars-${player.luck}`);
                        if (avatarContainer) {
                            const avatar = document.createElement('div');
                            avatar.className = 'mini-avatar';
                            avatar.textContent = player.avatar;
                            avatar.title = `${player.name} (運氣: ${player.luck})`;
                            avatarContainer.appendChild(avatar);
                        }
                    }
                });

                for (let i = 1; i <= 60; i++) {
                    const avatarContainer = document.getElementById(`avatars-${i}`);
                    if (avatarContainer && avatarContainer.children.length > 2) {
                        document.getElementById(`luck-cell-${i}`).classList.add('crowded');
                    }
                }
            }

            addLuck(playerId, amount, reason) {
                const player = this.players[playerId];
                const oldLuck = player.luck;
                player.luck = Math.min(60, player.luck + amount);
                
                this.updateLuckTowerDisplay();
                
                if (player.luck !== oldLuck) {
                    this.addBattleLog(playerId, `🎲 ${player.name} ${reason}獲得 ${amount} 運氣！(位置: ${player.luck}/60)`);
                    
                    if (FACTION_SPOTS[player.luck] && player.luck > oldLuck) {
                        this.triggerFactionBonus(playerId, FACTION_SPOTS[player.luck]);
                    }
                    
                    if (player.luck >= 60) {
                        this.gameOver = true;
                        this.addBattleLog('system', `🎉 ${player.name} 登上運氣塔頂獲勝！`);
                        this.showGameOver(`🎉 ${player.name} 運氣勝利！`);
                    }
                }
            }

            triggerFactionBonus(playerId, faction) {
                const player = this.players[playerId];
                const factionInfo = FACTIONS[faction];
                
                this.addBattleLog('system', `✨ ${player.name} 踩到${factionInfo.icon}${factionInfo.name}格！觸發獎勵！`);
                
                switch(faction) {
                    case 'charm':
                        this.drawCard(playerId);
                        this.addBattleLog(playerId, `${factionInfo.icon} 魅力獎勵：抽1張牌`);
                        break;
                    case 'capital':
                        player.mana = Math.min(player.maxMana, player.mana + 2);
                        this.addBattleLog(playerId, `${factionInfo.icon} 資本獎勵：獲得2點法力`);
                        break;
                    case 'wisdom':
                        this.drawCard(playerId);
                        this.drawCard(playerId);
                        this.addBattleLog(playerId, `${factionInfo.icon} 智慧獎勵：抽2張牌`);
                        break;
                    case 'harmony':
                        this.healHero(playerId, 5);
                        this.addBattleLog(playerId, `${factionInfo.icon} 協調獎勵：恢復5點生命`);
                        break;
                    case 'power':
                        this.battlefield.forEach((slot, idx) => {
                            if (slot && slot.owner !== playerId) {
                                this.showDamageEffect(idx, '-1');
                                slot.card.currentHealth -= 1;
                                if (slot.card.currentHealth <= 0) {
                                    this.battlefield[idx] = null;
                                    this.addBattleLog('system', `💀 ${slot.card.name} 被力量摧毀`);
                                }
                            }
                        });
                        this.addBattleLog(playerId, `${factionInfo.icon} 力量獎勵：對敵方生物造成1點傷害`);
                        break;
                }
                
                this.updateUI();
            }

            addScore(playerId, points, reason) {
                const player = this.players[playerId];
                const oldScore = player.score;
                player.score = Math.min(15, player.score + points);
                
                if (player.score !== oldScore) {
                    this.addBattleLog(playerId, `📈 ${player.name} ${reason}獲得 ${points} 分！(總分: ${player.score}/15)`);
                    
                    const badge = document.getElementById(`score-badge-${playerId + 1}`);
                    if (badge && player.score >= 12) {
                        badge.classList.add('high-score');
                    }
                    
                    if (player.score >= 15) {
                        this.gameOver = true;
                        this.addBattleLog('system', `🎉 ${player.name} 率先達到15分獲勝！`);
                        this.showGameOver(`🎉 ${player.name} 分數勝利！`);
                    }
                }
            }

            getPlayerName(playerId) { return this.players[playerId].name; }
            getAliveOpponents(playerId) { return this.players.filter(p => p.id !== playerId && !p.eliminated).map(p => p.id); }
            getAlivePlayers() { return this.players.filter(p => !p.eliminated); }

            initDecks() {
                this.players.forEach(player => {
                    CARD_DATABASE.forEach(cardTemplate => {
                        player.deck.push({
                            ...cardTemplate,
                            currentHealth: cardTemplate.health,
                            instanceId: Math.random()
                        });
                    });
                    
                    player.deck = this.shuffleDeck(player.deck);
                    
                    for (let i = 0; i < 3; i++) {
                        this.drawCard(player.id);
                    }
                });
            }

            shuffleDeck(deck) {
                const shuffled = [...deck];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            startGame() {
                this.addBattleLog('system', '🎮 五勢力混戰開始！目標：15分 或 登上運氣塔頂！');
                this.addBattleLog('system', '🎲 運氣塔：60格共用軌道，踩到勢力格獲得特殊獎勵！');
                this.startTurn();
            }

            startTurn() {
                const player = this.players[this.currentPlayerIndex];
                if (player.eliminated) { 
                    this.nextTurn(); 
                    return; 
                }

                player.maxMana = Math.min(10, player.maxMana + 1);
                player.mana = player.maxMana;
                this.drawCard(player.id);

                if (Math.random() < 0.25) {
                    this.addLuck(player.id, 1, '回合開始');
                }

                this.battlefield.forEach(slot => {
                    if (slot && slot.owner === player.id) {
                        slot.hasAttacked = false;
                    }
                });

                this.selectedCardIndex = null;
                this.selectedAttackerIndex = null;
                this.updateUI();
                this.showTurnIndicator(`${player.name}的回合`);

                if (player.id !== 0) {
                    document.getElementById('end-turn-btn').disabled = true;
                    setTimeout(() => this.aiTurn(player.id), 1500);
                } else {
                    document.getElementById('end-turn-btn').disabled = false;
                }
            }

            drawCard(playerId) {
                const player = this.players[playerId];
                const playerName = player.name;
                
                if (player.deck.length === 0) {
                    this.damageHero(playerId, 2);
                    this.addBattleLog(playerId, `💀 ${playerName}牌庫耗盡，受到2點疲勞傷害`);
                    return null;
                }
                
                if (player.hand.length >= 10) {
                    const burnedCard = player.deck.shift();
                    this.addBattleLog(playerId, `🔥 ${playerName}手牌已滿，燒毀了${burnedCard.name}`);
                    return null;
                }
                
                const card = player.deck.shift();
                player.hand.push(card);
                
                if (playerId === 0) {
                    this.addBattleLog(playerId, `📥 抽到了 ${card.emoji}${card.name} (${this.getFactionName(card.faction)})`);
                }
                
                return card;
            }

            getFactionName(faction) {
                return FACTIONS[faction] ? FACTIONS[faction].name : faction;
            }

            playCardToSlot(playerId, cardIndex, slotIndex) {
                const player = this.players[playerId];
                const card = player.hand[cardIndex];
                const playerName = player.name;
                
                if (!card || player.mana < card.cost || this.battlefield[slotIndex] !== null) {
                    return false;
                }

                player.mana -= card.cost;
                player.hand.splice(cardIndex, 1);

                const fieldCard = {
                    ...card,
                    currentHealth: card.health,
                    canAttack: false,
                    hasAttacked: false
                };

                this.battlefield[slotIndex] = {
                    card: fieldCard,
                    owner: playerId,
                    hasAttacked: true
                };

                const row = Math.floor(slotIndex / 4) + 1;
                const col = (slotIndex % 4) + 1;
                
                this.addBattleLog(
                    playerId, 
                    `🃏 ${playerName}在[${row},${col}]召喚了 ${card.emoji}${card.name} (${this.getFactionName(card.faction)})`
                );

                if (card.scoreValue) {
                    this.addScore(playerId, card.scoreValue, '出牌');
                }

                if (Math.random() < 0.2) {
                    this.addLuck(playerId, 1, '出牌');
                }

                this.selectedCardIndex = null;
                this.updateUI();
                return true;
            }

            attackCreature(attackerSlot, targetSlot) {
                const attacker = this.battlefield[attackerSlot];
                const target = this.battlefield[targetSlot];
                
                if (!attacker || !target || attacker.owner === target.owner || attacker.hasAttacked) {
                    return false;
                }

                const attackerDamage = attacker.card.attack;
                const targetDamage = target.card.attack;

                this.showDamageEffect(targetSlot, `-${attackerDamage}`);
                this.showDamageEffect(attackerSlot, `-${targetDamage}`);

                target.card.currentHealth -= attackerDamage;
                attacker.card.currentHealth -= targetDamage;
                attacker.hasAttacked = true;

                this.addBattleLog(
                    attacker.owner, 
                    `⚔️ ${attacker.card.name} 攻擊 ${target.card.name}，造成${attackerDamage}傷害`
                );

                if (target.card.currentHealth <= 0) {
                    this.battlefield[targetSlot] = null;
                    this.addBattleLog(target.owner, `💀 ${target.card.name} 被摧毀`);
                    this.addScore(attacker.owner, 2, '擊殺生物');
                    this.addLuck(attacker.owner, 2, '擊殺生物');
                }
                if (attacker.card.currentHealth <= 0) {
                    this.battlefield[attackerSlot] = null;
                    this.addBattleLog(attacker.owner, `💀 ${attacker.card.name} 戰死`);
                }

                this.selectedAttackerIndex = null;
                this.updateUI();
                return true;
            }

            attackPlayer(attackerSlot, targetPlayerId) {
                const attacker = this.battlefield[attackerSlot];
                const targetPlayer = this.players[targetPlayerId];
                
                if (!attacker || attacker.hasAttacked || targetPlayer.eliminated) {
                    return false;
                }

                const damage = attacker.card.attack;
                this.damageHero(targetPlayerId, damage);
                attacker.hasAttacked = true;
                
                this.addBattleLog(
                    attacker.owner, 
                    `⚔️ ${attacker.card.name} 攻擊 ${targetPlayer.name}，造成${damage}點傷害`
                );
                
                this.addScore(attacker.owner, 1, '攻擊玩家');
                this.addLuck(attacker.owner, 1, '攻擊玩家');
                
                this.selectedAttackerIndex = null;
                this.updateUI();
                return true;
            }

            damageHero(playerId, damage) {
                const player = this.players[playerId];
                player.hp -= damage;
                player.hp = Math.max(0, player.hp);

                const playerCard = document.getElementById(`player${playerId + 1}-card`);
                if (playerCard) {
                    this.showDamageEffectOnElement(playerCard, `-${damage}`);
                }

                if (player.hp <= 0 && !player.eliminated) {
                    player.eliminated = true;
                    if (playerCard) {
                        playerCard.classList.add('eliminated');
                    }
                    this.addBattleLog('system', `💀 ${player.name} 被淘汰！`);
                    this.checkGameOver();
                }
                
                this.updateUI();
            }

            healHero(playerId, amount) {
                const player = this.players[playerId];
                const oldHp = player.hp;
                player.hp = Math.min(player.maxHp, player.hp + amount);
                const actualHeal = player.hp - oldHp;
                
                if (actualHeal > 0) {
                    const playerCard = document.getElementById(`player${playerId + 1}-card`);
                    if (playerCard) {
                        this.showHealEffectOnElement(playerCard, `+${actualHeal}`);
                    }
                }
                
                this.updateUI();
            }

            async aiTurn(playerId) {
                await this.aiPlayCards(playerId);
                await this.aiAttackPhase(playerId);
                setTimeout(() => {
                    this.addBattleLog(playerId, `⏭️ ${this.getPlayerName(playerId)}結束回合`);
                    this.nextTurn();
                }, 500);
            }

            async aiPlayCards(playerId) {
                const player = this.players[playerId];
                let actionTaken = true;
                
                while (actionTaken && player.mana > 0) {
                    actionTaken = false;
                    
                    const playableCards = player.hand
                        .map((card, index) => ({card, index}))
                        .filter(item => item.card.cost <= player.mana)
                        .sort((a, b) => b.card.cost - a.card.cost);

                    if (playableCards.length > 0) {
                        const emptySlots = [];
                        for (let i = 0; i < 16; i++) {
                            if (this.battlefield[i] === null) {
                                emptySlots.push(i);
                            }
                        }

                        if (emptySlots.length > 0) {
                            const cardItem = playableCards[0];
                            const slotIndex = emptySlots[Math.floor(Math.random() * emptySlots.length)];
                            
                            this.playCardToSlot(playerId, cardItem.index, slotIndex);
                            actionTaken = true;
                            
                            await new Promise(resolve => setTimeout(resolve, 800));
                        }
                    }
                }
            }

            async aiAttackPhase(playerId) {
                const attackers = [];
                this.battlefield.forEach((slot, index) => {
                    if (slot && slot.owner === playerId && !slot.hasAttacked) {
                        attackers.push(index);
                    }
                });

                for (const attackerIndex of attackers) {
                    const enemyCreatures = [];
                    this.battlefield.forEach((slot, index) => {
                        if (slot && slot.owner !== playerId) {
                            enemyCreatures.push(index);
                        }
                    });

                    if (enemyCreatures.length > 0 && Math.random() > 0.3) {
                        const targetIndex = enemyCreatures[Math.floor(Math.random() * enemyCreatures.length)];
                        this.attackCreature(attackerIndex, targetIndex);
                    } else {
                        const aliveEnemies = this.getAliveOpponents(playerId);
                        if (aliveEnemies.length > 0) {
                            aliveEnemies.sort((a, b) => this.players[a].hp - this.players[b].hp);
                            this.attackPlayer(attackerIndex, aliveEnemies[0]);
                        }
                    }

                    await new Promise(resolve => setTimeout(resolve, 600));
                }
            }

            nextTurn() {
                let nextIndex = (this.currentPlayerIndex + 1) % 4;
                let attempts = 0;
                
                while (this.players[nextIndex].eliminated && attempts < 4) {
                    nextIndex = (nextIndex + 1) % 4;
                    attempts++;
                }

                this.currentPlayerIndex = nextIndex;
                
                if (this.currentPlayerIndex === 0) {
                    this.round++;
                }

                this.startTurn();
            }

            endTurn() {
                if (this.currentPlayerIndex !== 0 || this.gameOver) return;
                
                this.addBattleLog(0, `⏭️ 你結束了回合`);
                this.nextTurn();
            }

            checkGameOver() {
                const alivePlayers = this.getAlivePlayers();
                
                if (alivePlayers.length === 1) {
                    this.gameOver = true;
                    const winner = alivePlayers[0];
                    this.addBattleLog('system', `🎉 ${winner.name} 存活獲勝！`);
                    this.showGameOver(`🎉 ${winner.name} 獲勝！`);
                } else if (alivePlayers.length === 0) {
                    this.gameOver = true;
                    this.addBattleLog('system', '💥 所有玩家同歸於盡！');
                    this.showGameOver('💥 平局！');
                }
            }

            addBattleLog(playerId, message) {
                const timestamp = new Date().toLocaleTimeString('zh-TW', { 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
                
                const logClass = playerId === 'system' ? 'log-system' : `log-player${playerId + 1}`;
                
                this.battleLog.push({
                    timestamp,
                    playerId,
                    message,
                    class: logClass
                });

                this.renderBattleLog();
            }

            renderBattleLog() {
                const logContent = document.getElementById('battle-log-content');
                const recentLogs = this.battleLog.slice(-30);
                
                logContent.innerHTML = recentLogs.map(log => `
                    <div class="log-entry ${log.class}">
                        <div class="log-time">${log.timestamp}</div>
                        ${log.message}
                    </div>
                `).join('');

                logContent.scrollTop = logContent.scrollHeight;
            }

            showDamageEffect(slotIndex, text) {
                const battlefield = document.getElementById('battlefield');
                const slots = battlefield.children;
                if (slots[slotIndex]) {
                    this.showDamageEffectOnElement(slots[slotIndex], text);
                }
            }

            showDamageEffectOnElement(element, text) {
                const damageEl = document.createElement('div');
                damageEl.className = 'damage-text';
                damageEl.textContent = text;
                damageEl.style.color = text.startsWith('+') ? '#51cf66' : '#ff6b6b';
                
                const rect = element.getBoundingClientRect();
                damageEl.style.left = (rect.left + rect.width / 2 - 15) + 'px';
                damageEl.style.top = (rect.top + rect.height / 2) + 'px';
                damageEl.style.position = 'fixed';
                
                document.body.appendChild(damageEl);
                setTimeout(() => damageEl.remove(), 1000);
            }

            showHealEffectOnElement(element, text) {
                this.showDamageEffectOnElement(element, text);
            }

            showTurnIndicator(text) {
                const indicator = document.getElementById('turn-indicator');
                indicator.textContent = text;
                indicator.classList.remove('show');
                void indicator.offsetWidth;
                indicator.classList.add('show');
            }

            showGameOver(text) {
                const gameOverEl = document.getElementById('game-over');
                
                const sortedPlayers = [...this.players].sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    if (b.luck !== a.luck) return b.luck - a.luck;
                    return b.hp - a.hp;
                });
                
                const ranking = sortedPlayers.map((p, i) => 
                    `${i + 1}. ${p.name}: ${p.score}分 (運氣:${p.luck}, 生命:${p.hp})`
                ).join('<br>');
                
                gameOverEl.innerHTML = `
                    ${text}
                    <div style="font-size: 0.6em; margin-top: 20px;">
                        <strong>最終排名：</strong><br>${ranking}
                    </div>
                    <div style="font-size: 0.5em; margin-top: 15px; opacity: 0.8;">
                        點擊「重新開始」按鈕開始新遊戲
                    </div>
                `;
                gameOverEl.classList.add('show');
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' && !this.gameOver) { 
                        e.preventDefault(); 
                        this.endTurn(); 
                    }
                    if (e.code === 'Escape') { 
                        this.selectedCardIndex = null; 
                        this.selectedAttackerIndex = null; 
                        this.updateUI(); 
                    }
                });
            }

            handleCardClick(cardIndex) {
                if (this.currentPlayerIndex !== 0 || this.gameOver) return;
                
                const player = this.players[0];
                const card = player.hand[cardIndex];
                if (!card) return;
                
                const hasEmptySlots = this.battlefield.some(slot => slot === null);
                if (player.mana >= card.cost && hasEmptySlots) {
                    this.selectedCardIndex = cardIndex;
                    this.selectedAttackerIndex = null;
                    this.updateUI();
                } else if (!hasEmptySlots) {
                    this.addBattleLog(0, '戰場已滿！');
                } else {
                    this.addBattleLog(0, '法力值不足！');
                }
            }

            handleSlotClick(slotIndex) {
                if (this.currentPlayerIndex !== 0 || this.gameOver) return;
                
                const slot = this.battlefield[slotIndex];

                if (this.selectedCardIndex !== null) {
                    if (slot === null) {
                        this.playCardToSlot(0, this.selectedCardIndex, slotIndex);
                    } else {
                        this.addBattleLog(0, '該位置已有卡牌！');
                    }
                    return;
                }

                if (slot && slot.owner === 0 && !slot.hasAttacked) {
                    this.selectedAttackerIndex = slotIndex;
                    this.selectedCardIndex = null;
                    this.updateUI();
                    return;
                }

                if (this.selectedAttackerIndex !== null) {
                    if (slot && slot.owner !== 0) {
                        this.attackCreature(this.selectedAttackerIndex, slotIndex);
                    }
                }
            }

            handlePlayerClick(targetPlayerId) {
                if (this.currentPlayerIndex !== 0 || this.gameOver || targetPlayerId === 0) return;
                
                if (this.selectedAttackerIndex !== null) {
                    this.attackPlayer(this.selectedAttackerIndex, targetPlayerId);
                }
            }

            updateUI() {
                this.players.forEach((player, index) => {
                    document.getElementById(`player${index + 1}-hp`).textContent = player.hp;
                    document.getElementById(`player${index + 1}-mana`).textContent = player.mana;
                    document.getElementById(`player${index + 1}-deck`).textContent = player.deck.length;
                    document.getElementById(`player${index + 1}-score`).textContent = player.score;
                    document.getElementById(`player${index + 1}-luck`).textContent = player.luck;

                    const playerCard = document.getElementById(`player${index + 1}-card`);
                    if (index === this.currentPlayerIndex) {
                        playerCard.classList.add('active-turn');
                    } else {
                        playerCard.classList.remove('active-turn');
                    }
                });

                this.updateLuckTowerDisplay();
                this.renderPlayerHand();
                this.renderAIHands();
                this.renderBattlefield();
                this.updateEndTurnButton();
            }

            renderPlayerHand() {
                const handContainer = document.getElementById('player1-hand');
                const player = this.players[0];
                
                handContainer.innerHTML = player.hand.map((card, index) => {
                    const hasEmptySlots = this.battlefield.some(slot => slot === null);
                    const canPlay = this.currentPlayerIndex === 0 && 
                                   player.mana >= card.cost && 
                                   hasEmptySlots;
                    const isSelected = this.selectedCardIndex === index;
                    
                    return `
                        <div class="card ${card.faction} ${canPlay ? 'playable' : ''} ${isSelected ? 'selected' : ''}" 
                             onclick="game.handleCardClick(${index})">
                            <div class="card-cost">${card.cost}</div>
                            <div class="card-emoji">${card.emoji}</div>
                            <div class="card-name">${card.name}</div>
                            <div class="card-faction">${this.getFactionName(card.faction)}(${card.cost})</div>
                            <div class="card-stats">
                                <span class="card-atk">⚔${card.attack}</span>
                                <span class="card-hp">❤${card.health}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderAIHands() {
                for (let i = 1; i < 4; i++) {
                    const handContainer = document.getElementById(`player${i + 1}-hand`);
                    const player = this.players[i];
                    handContainer.innerHTML = player.hand.map(() => `<div class="ai-card-back">🎴</div>`).join('');
                }
            }

            renderBattlefield() {
                const battlefield = document.getElementById('battlefield');
                battlefield.innerHTML = '';
                
                for (let i = 0; i < 16; i++) {
                    const slot = this.battlefield[i];
                    const slotEl = document.createElement('div');
                    let className = 'grid-slot';
                    
                    if (slot) {
                        className += ` slot-player${slot.owner + 1}`;
                        const canAttack = this.currentPlayerIndex === slot.owner && !slot.hasAttacked;
                        const isSelected = this.selectedAttackerIndex === i;
                        
                        slotEl.innerHTML = `
                            <div class="card field-card ${slot.card.faction} ${canAttack ? 'can-attack' : ''} ${isSelected ? 'selected' : ''}">
                                <div class="card-cost">${slot.card.cost}</div>
                                <div class="card-emoji">${slot.card.emoji}</div>
                                <div class="card-name">${slot.card.name}</div>
                                <div class="card-faction">${this.getFactionName(slot.card.faction)}</div>
                                <div class="card-stats">
                                    <span class="card-atk">⚔${slot.card.attack}</span>
                                    <span class="card-hp">❤${slot.card.currentHealth}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        if (this.selectedCardIndex !== null && this.currentPlayerIndex === 0) {
                            className += ' highlighted';
                        } else {
                            className += ' empty';
                        }
                    }
                    
                    slotEl.className = className;
                    slotEl.onclick = () => this.handleSlotClick(i);
                    battlefield.appendChild(slotEl);
                }
            }

            updateEndTurnButton() {
                const btn = document.getElementById('end-turn-btn');
                
                if (this.currentPlayerIndex === 0 && !this.gameOver && !this.players[0].eliminated) {
                    btn.disabled = false;
                    btn.textContent = '結束回合 (空白鍵)';
                } else {
                    btn.disabled = true;
                    if (this.gameOver) {
                        btn.textContent = '遊戲已結束';
                    } else if (this.players[0].eliminated) {
                        btn.textContent = '你已被淘汰';
                    } else {
                        btn.textContent = `${this.getPlayerName(this.currentPlayerIndex)}回合中...`;
                    }
                }
            }
        }

        let game = new Game();

        function resetGame() {
            document.getElementById('game-over').classList.remove('show');
            game = new Game();
        }

        window.game = game;
    </script>
</body>
</html>
